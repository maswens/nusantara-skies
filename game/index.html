<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nusantara Skies: fly a small aeroplane over a tropical archipelago — through rings, between islands, and land on the runway.">
<title>Nusantara Skies — a flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1a2e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Nusantara Skies: fly a small aeroplane over a tropical archipelago, through rings, between islands, and land on the runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#eef4f7;font-family:sans-serif;text-align:center">Nusantara Skies needs JavaScript to fly.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
